default_ethereum_client_images:
  ### Consensus layer clients
  # Pinned to the unstable build tested in kurtosis so watchtower cannot roll a new
  # unstable onto every CL between genesis and the bogota fork. Bump deliberately
  # (e.g. once sigp/lighthouse#9878 lands).
  lighthouse: ethpandaops/lighthouse:unstable-4b1f3c2
  lodestar: chainsafe/lodestar:latest
  nimbus: statusim/nimbus-eth2:multiarch-latest
  prysm: gcr.io/offchainlabs/prysm/beacon-chain:latest
  prysm_validator: gcr.io/offchainlabs/prysm/validator:latest
  # Bootnode CL. Stable teku (26.9.0) fails a Gloas genesis ("Genesis block root ... does not
  # match genesis state latest block root"); master handles it. Pinned like lighthouse.
  teku: ethpandaops/teku:master-deb3e80
  grandine: ethpandaops/grandine:develop
  ### Execution layer clients
  besu: hyperledger/besu:latest
  geth: ethpandaops/geth:frames-devnet-0
  erigon: erigontech/erigon:main-latest
  nethermind: ethpandaops/nethermind:frames-devnet-0
  reth: ethpandaops/reth:frames-devnet-0
  nimbusel: ethpandaops/nimbus-eth1:master
  ethrex: ethpandaops/ethrex:frames-devnet-0

